# signal-api.phaisinh.online — API công khai cho Worker signal.phaisinh.online
# Đặt vào aaPanel -> Website -> signal-api.phaisinh.online -> Config (SSL Let's Encrypt như các site khác).
# Chỉ mở các đường dẫn GET công khai + webhook TradingView; mọi đường dẫn khác (CMS, API quản trị) trả 404.

map $request_method $signal_api_get_only { default 1; GET 0; HEAD 0; OPTIONS 0; }

server {
    listen 80;
    listen 443 ssl http2;
    server_name signal-api.phaisinh.online;
    root /www/server/stop;

    # ssl_certificate ...; ssl_certificate_key ...;

    access_log /www/wwwlogs/signal-api.phaisinh.online.log;
    error_log  /www/wwwlogs/signal-api.phaisinh.online.error.log;

    # Tùy chọn: chỉ nhận request từ Worker (đặt cùng giá trị với secret ORIGIN_SECRET của Worker).
    # Bỏ comment 3 dòng dưới sau khi đã `wrangler secret put ORIGIN_SECRET`.
    # set $edge_ok 0;
    # if ($http_x_edge_secret = "THAY_BANG_CHUOI_NGAU_NHIEN") { set $edge_ok 1; }
    # if ($edge_ok = 0) { return 403; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;

    # SSE giá VN30F1M
    location = /api/v1/prices/stream {
        if ($signal_api_get_only) { return 405; }
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # API công khai (chỉ GET)
    location = /api/v1/market/price         { if ($signal_api_get_only) { return 405; } proxy_pass http://127.0.0.1:8765; }
    location = /api/v1/bots/leaderboard     { if ($signal_api_get_only) { return 405; } proxy_pass http://127.0.0.1:8765; }
    location = /api/v1/bots                 { if ($signal_api_get_only) { return 405; } proxy_pass http://127.0.0.1:8765; }
    location ~ ^/api/v1/bots/[A-Za-z0-9_-]{1,32}(/signals)?$ {
        if ($signal_api_get_only) { return 405; }
        proxy_pass http://127.0.0.1:8765;
    }

    # Webhook TradingView do Worker chuyển tiếp (POST). Phản hồi phải < 3 giây.
    location ~ ^/(trade|api/trade|api/v1/trade)$ {
        proxy_pass http://127.0.0.1:8765;
        client_max_body_size 64k;
    }

    location / { return 404; }
}
